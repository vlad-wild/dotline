# dotline — lid-close behaviour (plan §"Крышка ноутбука").
#
# Before this file existed, closing the lid did nothing at the systemd
# level at all: niri's own `switch-events { lid-close { ... } }` (see
# config.kdl) only locks the session, it never actually suspends the
# machine — meaning a closed lid would just keep draining the battery.
# This is the other half of that: the actual power action.
#
# Key names and values confirmed from systemd's own logind.conf(5):
# precedence is Docked > ExternalPower > plain (unqualified) — so a
# docked laptop (second monitor connected, e.g. the eGPU "desk mode" from
# the plan) ignores the lid entirely, on AC it just suspends (no rush to
# hibernate while powered), and on battery it suspends-then-hibernates
# (falls back to hibernate after systemd-sleep.conf.d's HibernateDelaySec,
# or automatically below 5% battery — both are systemd's own behaviour,
# not something this rice has to implement).
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
