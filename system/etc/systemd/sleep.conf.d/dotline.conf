# dotline — suspend-then-hibernate delay (plan §"Батарея и сон").
#
# 2h is already systemd's own built-in default when this is unset —
# written explicitly so the intent is documented here rather than relying
# on an upstream default that could change. Needs the 32 GiB swapfile from
# docs/install-arch.md (real hibernation, not just suspend, needs swap at
# least as large as RAM). Below 5% battery systemd hibernates immediately
# regardless of this delay — also its own behaviour, confirmed from
# systemd-sleep.conf(5), not something this rice implements separately.
[Sleep]
HibernateDelaySec=2h
