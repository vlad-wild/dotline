# dotline — static part of the kitty theme.
#
# Font, layout and a real 16-colour ANSI scheme live here, so diffs, `ls`
# and syntax highlighting stay legible. theme-dotline.conf (regenerated by
# scripts/palette-post whenever the wallpaper changes) is included last and
# only overrides the surface colours and the two red/dim slots — see the
# comment at the top of scripts/palette-templates/kitty.conf.tmpl.

font_family      family="JetBrainsMono Nerd Font" weight=500
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

adjust_line_height  110%
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

cursor_shape beam
cursor_blink_interval 0
shell_integration enabled

# ---------- static ANSI colours (kept readable independent of the wallpaper) ----------
# black / bright black
color0  #1b1b1d
color8  #6b6b6f
# red / bright red — overridden by theme-dotline.conf to the live accent
color1  #d75f5f
color9  #ff6b6b
# green / bright green
color2  #8fbf7f
color10 #a3d68c
# yellow / bright yellow
color3  #d7b56d
color11 #f0c987
# blue / bright blue
color4  #7fa8d9
color12 #93bdf0
# magenta / bright magenta
color5  #b58fd9
color13 #c9a3ec
# cyan / bright cyan
color6  #7fc1c9
color14 #93d6de
# white / bright white
color7  #d0d0d0
color15 #f2f2f0

include theme-dotline.conf
