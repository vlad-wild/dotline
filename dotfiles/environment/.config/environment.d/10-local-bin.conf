# Picked up by systemd --user (and pam_systemd, before greetd starts the
# graphical session) — unlike a shell rc file, this applies even though niri
# is launched by greetd and never runs a login shell. Needed so niri's own
# `spawn` can find dotline-wallpaper / dotline-theme by name (lib/common.sh's
# link_bin puts them in ~/.local/bin).
PATH=%h/.local/bin:${PATH}
