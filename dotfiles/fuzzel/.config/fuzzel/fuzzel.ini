# dotline — static part of the fuzzel launcher.
#
# Colours come from ~/.config/fuzzel/dotline-colors.ini, regenerated by
# scripts/palette-post whenever the wallpaper changes (see the `include`
# below, which fuzzel's own docs say belongs at top level, not inside
# [main]).
include=~/.config/fuzzel/dotline-colors.ini

[main]
font=Space Grotesk:size=13
icon-theme=Papirus-Dark
lines=8
width=42
horizontal-pad=24
vertical-pad=18
inner-pad=10
line-height=28
prompt="Поиск> "
layer=overlay
terminal=kitty

[border]
width=0
radius=32
