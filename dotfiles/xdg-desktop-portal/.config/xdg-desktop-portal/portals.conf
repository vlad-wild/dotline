# Without this, having both xdg-desktop-portal-gnome and
# xdg-desktop-portal-gtk installed (packages/desktop.txt) leaves the
# frontend to pick a ScreenCast backend on its own — and niri's own docs
# point at xdg-desktop-portal-gnome (via PipeWire) as the one that
# actually works for screencast under niri, not -gtk. Pinning it here
# avoids the "no screencast backend"/picks-the-wrong-one failure mode —
# needed for Win+Alt+R recording, Zoom/Meet screen share, and casting to a
# TV via gnome-network-displays (docs/screencast.md). Syntax confirmed
# from xdg-desktop-portal's own docs (flatpak.github.io/xdg-desktop-portal).
[preferred]
default=gnome;gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
